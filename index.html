<style>
/* ===== 设计 token ===== */
:root{
  --bg:#F6F5F2; --surface:#FFFFFF;
  --ink:#2B2A27; --sub:#9B968C; --faint:#C6C1B6;
  --line:rgba(43,42,39,.06); --line-strong:rgba(43,42,39,.12);
  --accent:#A08C6A; --accent-soft:rgba(160,140,106,.14); --accent-deep:#8A7554;
  --green:#8FAF8B; --warn:#BC7A5E; --warn-soft:rgba(188,122,94,.12);
  --r-s:12px; --r-m:18px; --r-l:24px;
  --shadow:0 1px 2px rgba(43,42,39,.04), 0 8px 24px rgba(43,42,39,.06);
  --sans:-apple-system,BlinkMacSystemFont,"PingFang SC","SF Pro Text","Helvetica Neue",sans-serif;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#171613; --surface:#211F1C;
    --ink:#F2EFE9; --sub:#8B867C; --faint:#56524A;
    --line:rgba(242,239,233,.08); --line-strong:rgba(242,239,233,.16);
    --accent:#B8A47E; --accent-soft:rgba(184,164,126,.18); --accent-deep:#CBBA97;
    --warn:#CE8E72; --warn-soft:rgba(206,142,114,.16);
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.35);
  }
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
/* 隐藏所有滚动条 */
*{-ms-overflow-style:none; scrollbar-width:none}
*::-webkit-scrollbar{display:none; width:0; height:0}
/* html 也要有背景色，否则 iOS 橡皮筋回弹/视口切换时底部露出异色条 */
html{background:#F6F5F2; overscroll-behavior:none}
@media (prefers-color-scheme: dark){ html{background:#171613} }
html,body{height:100%}
body{
  font-family:var(--sans); background:#E9E7E2; color:var(--ink);
  display:flex; align-items:center; justify-content:center; min-height:100vh;
}
@media (prefers-color-scheme: dark){ body{background:#000} }

/* ===== 桌面设备壳（≤540px 真机全屏） ===== */
.phone{
  width:390px; height:844px; background:var(--bg); border-radius:47px;
  box-shadow:0 0 0 10px #1b1a18, 0 0 0 12px #3a3835, 0 30px 80px rgba(0,0,0,.35);
  overflow:hidden; position:relative; display:flex; flex-direction:column;
}
.screen{flex:1; display:flex; flex-direction:column; position:relative; overflow:hidden}
.screen::before{ /* 动态岛 */
  content:""; position:absolute; top:12px; left:50%; transform:translateX(-50%);
  width:118px; height:34px; background:#1b1a18; border-radius:20px; z-index:60;
}
@media (max-width:540px){
  body{display:block; background:var(--bg)}
  /* fixed + 实时可视视口高度（--vvh 由 JS 更新）：
     底栏收起/展开时容器实时跟随，避免新露出区域闪白条 */
  .phone{position:fixed; top:0; left:0; right:0; height:var(--vvh, 100dvh); border-radius:0; box-shadow:none}
  .screen::before{display:none}
}
/* 主屏幕模式：根元素背景与页面严格同色，任何系统级缝隙都不可见 */
@media (display-mode: standalone){
  html, body{background:var(--bg)}
}

/* ===== 双 Tab 页 ===== */
.tab-page{
  position:absolute; inset:0; overflow-y:auto; -webkit-overflow-scrolling:touch;
  padding:56px 20px 160px; opacity:0; pointer-events:none; transition:opacity .18s;
}
.tab-page.active{opacity:1; pointer-events:auto}
@media (max-width:540px){
  .tab-page{padding-top:calc(env(safe-area-inset-top, 0px) + 12px)}
}

/* 顶部标题 */
.header{display:flex; align-items:baseline; justify-content:space-between; padding:14px 0 4px}
.header h1{font-size:30px; font-weight:700; letter-spacing:-.02em}
.ver-tag{font-size:11px; font-weight:600; color:var(--faint); letter-spacing:0;
  margin-left:6px; vertical-align:middle}
.header .sub-title{font-size:14px; color:var(--sub); font-weight:500}

/* ===== 首页：今日建议 ===== */
.advice-card{
  background:var(--surface); border:1px solid var(--line); border-radius:var(--r-m);
  padding:16px; margin-top:14px; box-shadow:var(--shadow);
}
.advice-head{display:flex; align-items:center; gap:8px; margin-bottom:10px}
.advice-head svg{width:17px; height:17px; stroke:var(--accent-deep); fill:none;
  stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round}
.advice-head .t{font-size:15px; font-weight:650}
.advice-badge{
  font-size:10px; font-weight:600; color:var(--accent-deep); background:var(--accent-soft);
  padding:2.5px 8px; border-radius:9px; margin-left:auto; letter-spacing:.03em; cursor:pointer;
}
.advice-badge:active{transform:scale(.95)}
/* AI 刷新中的加载转圈（显示在标题右侧） */
.advice-badge.loading{
  width:16px; height:16px; padding:0; border-radius:50%;
  background:transparent; border:2px solid var(--accent-soft); border-top-color:var(--accent);
  animation:adviceSpin .7s linear infinite; cursor:default;
}
@keyframes adviceSpin{to{transform:rotate(360deg)}}
.advice-cta{
  display:block; width:100%; margin-top:10px; padding:9px 0;
  border:none; border-radius:12px; cursor:pointer;
  background:var(--accent-soft); color:var(--accent-deep);
  font-size:13px; font-weight:600; font-family:var(--sans);
}
.advice-cta:active{transform:scale(.98)}
.advice-card .item{
  font-size:13.5px; color:var(--sub); line-height:1.7; display:flex; gap:8px;
}
.advice-card .item::before{
  content:""; width:4px; height:4px; border-radius:50%; background:var(--accent);
  flex-shrink:0; margin-top:8px;
}

/* ===== 日期分组标题（首页/日历共用） ===== */
.group-title{font-size:13px; font-weight:600; color:var(--sub); margin:20px 0 8px; letter-spacing:.02em}
.group-title .n{font-weight:500; margin-left:4px}
.group-title.overdue{color:var(--warn)}

/* ===== 任务卡 ===== */
.task{
  display:flex; align-items:center; gap:12px; background:var(--surface);
  border-radius:var(--r-m); padding:14px 16px; margin-bottom:8px;
  box-shadow:var(--shadow); border:1px solid var(--line);
  transition:opacity .2s, transform .2s;
  /* iOS 长按不触发文字选中/呼出菜单 */
  -webkit-user-select:none; user-select:none; -webkit-touch-callout:none;
}
.chk{
  width:24px; height:24px; border-radius:50%; flex-shrink:0;
  border:1.8px solid var(--line-strong); background:transparent; cursor:pointer;
  display:flex; align-items:center; justify-content:center; padding:0;
  transition:background .15s, border-color .15s;
}
.chk svg{width:13px; height:13px; stroke:#fff; stroke-width:2.6; fill:none;
  stroke-linecap:round; stroke-linejoin:round; opacity:0; transition:opacity .15s}
.chk svg polyline{stroke-dasharray:17; stroke-dashoffset:17;
  transition:stroke-dashoffset .25s ease .08s}
.task.done .chk{background:var(--green); border-color:var(--green)}
.task.done .chk svg{opacity:1}
.task.done .chk svg polyline{stroke-dashoffset:0}
.task .txt{flex:1; font-size:16px; font-weight:500; line-height:1.4; word-break:break-all}
.task.done{opacity:.55}
.task.done .txt{text-decoration:line-through; color:var(--sub); text-decoration-color:var(--faint)}
/* 任务动画：完成右滑退场 / 删除左滑退场 / 新增淡入 */
@keyframes slideOutRight{to{transform:translateX(72px); opacity:0}}
@keyframes slideOutLeft{to{transform:translateX(-72px); opacity:0}}
@keyframes taskIn{from{transform:translateY(10px) scale(.98); opacity:0}}
.task.enter{animation:taskIn .3s ease both}
.empty{ text-align:center; color:var(--faint); font-size:14px; padding:32px 0 8px}

/* ===== 日历页：周日期条 ===== */
.weeknav{display:flex; align-items:center; justify-content:space-between; margin:14px 0 10px}
.weeknav .month{font-size:16px; font-weight:650}
.weekbtn{
  width:32px; height:32px; border:none; border-radius:50%; background:var(--surface);
  color:var(--sub); font-size:15px; display:flex; align-items:center; justify-content:center;
  box-shadow:0 1px 3px rgba(43,42,39,.08); cursor:pointer;
}
.weekstrip{display:grid; grid-template-columns:repeat(7,1fr); gap:4px}
.day{
  display:flex; flex-direction:column; align-items:center; gap:3px;
  padding:8px 0 7px; border:none; border-radius:var(--r-s); background:transparent;
  font-family:var(--sans); cursor:pointer; position:relative;
}
.day .dow{font-size:11px; color:var(--sub); font-weight:500}
.day .num{font-size:17px; font-weight:600; color:var(--ink); width:32px; height:32px;
  display:flex; align-items:center; justify-content:center; border-radius:50%}
.day .dot{width:4px; height:4px; border-radius:50%; background:var(--faint)}
.day .dot.none{visibility:hidden}
.day.today .num{color:var(--accent-deep)}
.day.sel .num{background:var(--accent); color:#fff}
.day.sel .dow{color:var(--accent-deep)}

/* ===== 底部输入条（默认隐藏，点加号弹出） ===== */
.composer{
  position:absolute; left:16px; right:16px; bottom:calc(env(safe-area-inset-bottom, 0px) + 86px);
  padding:10px 0 14px;
  display:flex; gap:10px; z-index:30;
  opacity:0; transform:translateY(14px); pointer-events:none;
  transition:opacity .22s, transform .25s cubic-bezier(.32,.72,.35,1);
}
.composer.show{opacity:1; transform:none; pointer-events:auto}
.composer input{
  flex:1; height:46px; border:none; border-radius:23px; background:var(--surface);
  box-shadow:var(--shadow); border:1px solid var(--line);
  padding:0 18px; font-size:16px; font-family:var(--sans); color:var(--ink); outline:none;
}
.composer input::placeholder{color:var(--faint)}
.composer .confirm{
  height:46px; padding:0 18px; border:none; border-radius:23px; cursor:pointer;
  background:var(--accent); color:#fff; font-size:15px; font-weight:600; font-family:var(--sans);
  flex-shrink:0; box-shadow:0 4px 12px rgba(160,140,106,.4);
}
.composer .confirm:active{transform:scale(.95)}

/* ===== 底部导航栏：左对齐胶囊 + 右侧加号 ===== */
.dock{
  position:absolute; left:14px; right:14px;
  bottom:calc(env(safe-area-inset-bottom, 0px) + 16px);
  z-index:35; display:flex; align-items:center; justify-content:space-between;
  pointer-events:none;
}
.dock > *{pointer-events:auto}
.tabbar{
  display:flex; gap:4px; padding:6px;
  background:rgba(255,255,255,.72); backdrop-filter:blur(24px); -webkit-backdrop-filter:blur(24px);
  border-radius:999px; box-shadow:0 6px 24px rgba(43,42,39,.14), inset 0 0 0 .5px rgba(255,255,255,.6);

@media (prefers-color-scheme: dark){
  .tabbar{background:rgba(33,31,28,.72); box-shadow:0 6px 24px rgba(0,0,0,.4), inset 0 0 0 .5px rgba(255,255,255,.08)}

.tabbar button svg{width:22px; height:22px; stroke:currentColor; fill:none;

.tabbar button span{font-size:10px; font-weight:600; letter-spacing:.04em}
.tabbar button.active{background:var(--accent-soft); color:var(--accent-deep)}

/* 加号按钮（导航栏右侧）：展开/收起箭头 */
.addbtn{

  display:flex; align-items:center; justify-content:center;
  box-shadow:0 6px 18px rgba(160,140,106,.45);

}

  stroke-linecap:round; stroke-linejoin:round;
  transition:transform .3s cubic-bezier(.32,.72,.35,1)}
.addbtn.open svg{transform:rotate(180deg)}   /* 展开后箭头朝下 = 收起 */
.addbtn:active{transform:scale(.92)}

/* ===== iOS Action Sheet（编辑/删除菜单） ===== */
.sheet-mask{
  position:absolute; inset:0; background:rgba(0,0,0,.35); z-index:40;
  opacity:0; pointer-events:none; transition:opacity .25s;
}
.sheet, .edit-sheet{
  position:absolute; left:8px; right:8px; bottom:calc(env(safe-area-inset-bottom, 0px) + 8px);
  z-index:41; transform:translateY(110%); opacity:0; pointer-events:none; visibility:hidden;
  transition:transform .3s cubic-bezier(.32,.72,.35,1), opacity .25s, visibility 0s linear .3s;
}
/* 注意：仅靠 translateY(110%) 在有底部安全区的真机上会露出 ~20px 顶边，
   必须叠加 opacity/visibility 才能彻底隐藏 */
.sheet.show, .edit-sheet.show{
  transform:translateY(0); opacity:1; pointer-events:auto; visibility:visible;
  transition:transform .3s cubic-bezier(.32,.72,.35,1), opacity .25s;
}
.sheet-mask.show{opacity:1; pointer-events:auto}
.sheet .sheet-group{background:rgba(249,249,249,.94); backdrop-filter:blur(20px);
  border-radius:14px; overflow:hidden; margin-bottom:8px}
.sheet button{
  display:block; width:100%; border:none; background:transparent; cursor:pointer;
  padding:16px; font-size:18px; font-family:var(--sans); color:#007AFF;
  border-bottom:.5px solid rgba(60,60,67,.29);
}
.sheet button:last-child{border-bottom:none}
.sheet button.destructive{color:#FF3B30; font-weight:600}
.sheet .cancel{background:#fff; border-radius:14px; font-weight:600; border:none}
@supports (backdrop-filter:blur(1px)){ .sheet .cancel{background:rgba(249,249,249,.94); backdrop-filter:blur(20px)} }

/* ===== 编辑任务底部弹窗 ===== */
.edit-sheet .es-card{
  background:rgba(249,249,249,.96); backdrop-filter:blur(24px); -webkit-backdrop-filter:blur(24px);
  border-radius:16px; padding:18px 16px; display:flex; flex-direction:column; gap:12px;
}
.edit-sheet .es-title{font-size:15px; font-weight:650; text-align:center; color:var(--ink)}
.edit-sheet input{
  width:100%; height:44px; border:1px solid var(--line-strong); border-radius:12px;
  background:var(--surface); padding:0 14px; font-size:16px; font-family:var(--sans);
  color:var(--ink); outline:none; -webkit-appearance:none; appearance:none;
}
.edit-sheet input:focus{border-color:var(--accent)}
.edit-sheet .es-actions{display:flex; gap:8px; margin-top:2px}
.edit-sheet .es-actions button{
  flex:1; height:44px; border:none; border-radius:12px; cursor:pointer;
  font-size:16px; font-family:var(--sans); font-weight:600;
}
.edit-sheet .es-cancel{background:var(--accent-soft); color:var(--accent-deep)}

/* toast */
.toast{
  position:absolute; left:50%; bottom:150px; transform:translate(-50%, 10px);
  background:rgba(43,42,39,.85); color:#fff; font-size:13px; padding:8px 16px;
  border-radius:18px; opacity:0; transition:all .25s; z-index:50; pointer-events:none; white-space:nowrap;
}
.toast.show{opacity:1; transform:translate(-50%, 0)}

<script>
'use strict';
/* ===== 数据层：localStorage ===== */
var APP_VER = 31;         // 每次更新代码 +1，用于线上版本缓存检查
var STORE = 'qingqingdan.tasks.v1';
var tasks = [];           // [{id, date:'YYYY-MM-DD', text, done}]
var state = {
  tab: 'home',
  sel: todayISO(),                       // 日历页选中日期
  weekStart: weekStartOf(todayISO()),    // 当前周周一
  menuId: null, editId: null
};

function todayISO(){ return isoOf(new Date()); }
function isoOf(d){
  var m=d.getMonth()+1, day=d.getDate();
  return d.getFullYear()+'-'+(m<10?'0':'')+m+'-'+(day<10?'0':'')+day;
}
function weekStartOf(iso){
  var d = new Date(iso+'T00:00:00');
  var w = (d.getDay()+6)%7;             // 周一=0
  d.setDate(d.getDate()-w);
  return isoOf(d);
}
function addDays(iso, n){
  var d = new Date(iso+'T00:00:00'); d.setDate(d.getDate()+n);
  return isoOf(d);
}
function weekdayCN(iso){
  return '周' + '一二三四五六日'[(new Date(iso+'T00:00:00').getDay()+6)%7];
}
function load(){
  try{ tasks = JSON.parse(localStorage.getItem(STORE)) || []; }
  catch(e){ tasks = []; }
  if(!Array.isArray(tasks)) tasks = [];
}
function save(){ localStorage.setItem(STORE, JSON.stringify(tasks)); }
function byId(id){ return tasks.find(function(t){ return t.id===id; }); }

/* ===== 今日建议（本地规则版） =====
   === AI 接入点：后续把 getSuggestion() 的返回换成 AI 接口结果即可，
   返回格式：字符串数组，每条一句建议。 === */
function getSuggestion(){
  var today = todayISO(), out = [];
  var overdue = tasks.filter(function(t){ return !t.done && t.date < today; });
  var todayAll = tasks.filter(function(t){ return t.date === today; });
  var todayLeft = todayAll.filter(function(t){ return !t.done; });
  var week = tasks.filter(function(t){ return !t.done && t.date > today && t.date <= addDays(today,7); });
  /* 第一句永远是整体总结 */
  out.push('今天共 ' + todayAll.length + ' 件事，完成了 ' + (todayAll.length - todayLeft.length)
    + ' 件，还剩 ' + todayLeft.length + ' 件。');
  if(overdue.length)
    out.push('有 ' + overdue.length + ' 条任务逾期了，建议先清最早的一条。');
  var hour = new Date().getHours();
  if(hour >= 20){
    /* 晚 8 点后：转向明日建议 */
    var tmrLeft = tasks.filter(function(t){ return !t.done && t.date === addDays(today,1); }).length;
    out.push(tmrLeft
      ? '明天有 ' + tmrLeft + ' 件事，睡前过一遍，早点休息。'
      : '明天还没有安排，睡前可以规划一下。');
  } else if(todayLeft.length){
    out.push('先从最重要的一件开始做。');
  } else if(todayAll.length){
    out.push('今天全部完成，很棒。');
  }
  if(hour < 20 && week.length)
    out.push('未来 7 天还有 ' + week.length + ' 件事排队，注意分流。');
  return out.slice(0, 3);
}

/* ===== AI 建议（可选） =====
   Key 只存本机 localStorage，不进代码库；无配置时用本地规则。 */
var AISTORE = 'qingqingdan.ai.v1';
/* 上一条成功的 AI 建议持久化：刷新成功前一直显示旧的（重启也不丢） */
var aiCache = (function(){
  try{
    var c = JSON.parse(localStorage.getItem('qingqingdan.ai.cache.v1'));
    if(c && Array.isArray(c.lines) && c.lines.length) return c;
  }catch(e){}
  return { sig:'', lines:null, failedAt:0 };
})();
function saveAICache(){
  try{ localStorage.setItem('qingqingdan.ai.cache.v1', JSON.stringify(aiCache)); }catch(e){}
}
var adviceToken = 0;

function aiConf(){
  try{ return JSON.parse(localStorage.getItem(AISTORE)) || null; }
  catch(e){ return null; }
}
function renderAdvice(items, showCTA){
  if(!items || !items.length) items = getSuggestion();   /* 兜底：绝不让建议区空白 */
  var html = items.map(function(s){ return '<div class="item">'+esc(s)+'</div>'; }).join('');
  if(showCTA) html += '<button class="advice-cta" onclick="openAISet()">配置 AI，获取个性化建议</button>';
  document.getElementById('adviceBody').innerHTML = html;
}
function renderLoading(){
  document.getElementById('adviceBody').innerHTML =
    '<div class="item" style="color:var(--faint)">AI 正在根据你的任务生成建议…</div>';
}
function refreshAdvice(){
  var token = ++adviceToken;
  var badge = document.getElementById('adviceBadge');
  var c = aiConf();
  if(!c || !c.url || !c.key){
    badge.style.display = 'none';
    renderAdvice(getSuggestion(), true);   /* 未配置：本地建议 + 配置按钮 */
    return;
  }
  /* 今日无任务：不调 AI，直接本地提示 */
  if(tasks.filter(function(t){ return t.date===todayISO(); }).length === 0){
    badge.style.display = 'none';
    renderAdvice(['今天没有安排任务，好好休息，或从底部加一条今日目标。']);
    return;
  }
  /* 签名 = 今天前后各3天（含今天共7天）的任务内容+状态 + 未完成总数 + 当前小时；
     进入 app 或范围内任务变化时会重新请求，小时变化（如进入晚间）也会触发 */
  var win = addDays(todayISO(), -3), winEnd = addDays(todayISO(), 3);
  var sig = tasks.filter(function(t){ return t.date>=win && t.date<=winEnd; })
    .map(function(t){ return t.id+(t.done?'1':'0')+t.text+t.date; }).join('|')
    + '#' + tasks.filter(function(t){ return !t.done; }).length
    + '#' + new Date().getHours();
  if(sig === aiCache.sig && aiCache.lines){
    badge.classList.remove('loading');
    badge.textContent = 'AI'; badge.style.display = '';
    renderAdvice(aiCache.lines);
    return;
  }
  /* 上次失败 1 分钟内不重试，避免连续请求 */
  if(Date.now() - (aiCache.failedAt || 0) < 60*1000){
    badge.classList.remove('loading');
    if(aiCache.lines){
      badge.textContent = 'AI'; badge.style.display = '';
      renderAdvice(aiCache.lines);           /* 失败冷却期：保留旧建议 */
    } else {
      badge.style.display = 'none';
      renderAdvice(getSuggestion());
    }
    return;
  }
  badge.style.display = ''; badge.textContent = '';
  badge.classList.add('loading');          /* 标题右侧转圈 */
  if(!aiCache.lines) renderLoading();      /* 没有旧建议才显示加载文案，否则保留旧建议 */
  fetchAISuggestion(c).then(function(lines){
    if(token !== adviceToken) return;
    if(!lines.length) throw new Error('AI 返回为空');   /* 空结果按失败处理，保留旧建议 */
    aiCache = { sig:sig, lines:lines, failedAt:0 };
    saveAICache();
    badge.classList.remove('loading');
    badge.textContent = 'AI';
    renderAdvice(lines);
  }).catch(function(){
    if(token !== adviceToken) return;
    aiCache.failedAt = Date.now();
    saveAICache();
    badge.classList.remove('loading');
    if(aiCache.lines){
      badge.textContent = 'AI'; badge.style.display = '';
      renderAdvice(aiCache.lines);     /* 刷新失败：保留上一条成功的建议 */
    } else {
      badge.style.display = 'none';
      renderAdvice(getSuggestion());   /* 从未成功过：回退本地规则 */
    }
  });
}
/* 解析 AI 输出：优先按 JSON 数组取，失败则按行拆；
   超长行按句子断开，防止 AI 输出一大段 */
function parseAILines(content){
  var s = String(content||'').trim()
    .replace(/^```(?:json)?/i, '').replace(/```\s*$/, '').trim();
  var lines = null;
  try{
    var j = JSON.parse(s);
    if(Array.isArray(j)) lines = j.map(String);
  }catch(e){}
  if(!lines){
    /* JSON 被截断时解析会失败：直接提取引号里的内容，尽量保住每条建议 */
    var m = s.match(/"((?:[^"\\]|\\.)*)"/g);
    if(m && m.length >= 2) lines = m.map(function(x){ return x.slice(1,-1); });
  }
  if(!lines) lines = s.split('\n');
  var out = [];
  lines.forEach(function(l){
    l = String(l).replace(/^[-·\d.、\s]+/, '').trim()
        .replace(/^["'\[]+/, '').replace(/["'\]]+$/, '').trim();
    if(!l) return;
    if(l.length > 36){
      l.replace(/([。！？；])/g, '$1\n').split('\n').forEach(function(seg){
        seg = seg.trim();
        if(seg) out.push(seg.slice(0, 40));
      });
    } else out.push(l);
  });
  return out.slice(0, 3);
}
function fetchAISuggestion(c){
  var today = todayISO();
  /* 任务不多时全量带上（含完成状态）；超过 20 条则只发未完成的，控制 token */
  var src = tasks.length > 20 ? tasks.filter(function(t){ return !t.done; }) : tasks;
  var list = src.map(function(t){
    return { date:t.date, text:t.text, done:!!t.done, overdue:(!t.done && t.date<today) };
  });
  var sys = '你是用户的私人任务助手，根据用户的任务和完成状态输出「今日建议」。'
    + '严格只输出一个 JSON 数组，格式如 ["第一行","第二行","第三行"]，不要输出数组以外的任何文字、解释或 markdown。'
    + '数组共3个元素：第1个是一句话总结今天整体情况（共几件、完成几件、有无逾期）；第2、3个是具体行动建议。'
    + '注意时段：晚上20点后重点转向明天（预告明天任务、提醒收尾和休息），20点前以安排今天为主。'
    + '每个元素不超过25个字，直接说事、不客套，不要编号。';
  var body = JSON.stringify({
    today:today,
    tomorrow:addDays(today,1),
    hour:new Date().getHours(),
    weekday:'周'+'一二三四五六日'[(new Date().getDay()+6)%7],
    tasks:list
  });
  var ctrl = new AbortController();
  var timer = setTimeout(function(){ ctrl.abort(); }, 12000);
  return fetch(c.url, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + c.key },
    body: JSON.stringify({
      model: c.model || 'agnes-2.5-flash',
      messages: [ {role:'system', content:sys}, {role:'user', content:body} ],
      max_tokens: 400, temperature: 0.6
    }),
    signal: ctrl.signal
  }).then(function(r){
    clearTimeout(timer);
    if(!r.ok) throw new Error('HTTP '+r.status);
    return r.json();
  }).then(function(j){
    var msg = (j.choices && j.choices[0] && j.choices[0].message) || {};
    return parseAILines(msg.content);
  });
}
function openAISet(){
  var c = aiConf() || {};
  document.getElementById('aiUrl').value = c.url || 'https://apihub.agnes-ai.com/v1/chat/completions';
  document.getElementById('aiKey').value = c.key || '';
  document.getElementById('aiModel').value = c.model || 'agnes-2.5-flash';
  document.getElementById('mask').classList.add('show');
  document.getElementById('aiSheet').classList.add('show');
}
function saveAISet(){
  var url = document.getElementById('aiUrl').value.trim();
  var key = document.getElementById('aiKey').value.trim();
  var model = document.getElementById('aiModel').value.trim();
  if(!url || !key){
    localStorage.removeItem(AISTORE);
    closeAllSheets(); refreshAdvice(); toast('已清除 AI 配置');
    return;
  }
  localStorage.setItem(AISTORE, JSON.stringify({ url:url, key:key, model:model }));
  aiCache.sig = ''; aiCache.failedAt = 0;   /* 保留旧建议展示，强制重新请求 */
  saveAICache();
  closeAllSheets(); refreshAdvice(); toast('AI 配置已保存');
}
function testAI(){
  var url = document.getElementById('aiUrl').value.trim();
  var key = document.getElementById('aiKey').value.trim();
  var model = document.getElementById('aiModel').value.trim() || 'agnes-2.5-flash';
  if(!url || !key){ toast('请先填接口地址和 Key'); return; }
  toast('测试中…');
  fetch(url, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + key },
    body: JSON.stringify({ model:model, messages:[{role:'user', content:'回复OK两个字母即可'}], max_tokens:5 })
  }).then(function(r){
    if(!r.ok) throw new Error('HTTP '+r.status);
    return r.json();
  }).then(function(){ toast('连接成功，可以保存了'); })
    .catch(function(e){ toast('连接失败：' + e.message); });
}

/* ===== 渲染 ===== */
function render(){
  renderHome();
  renderCalendar();
  updatePlaceholder();
}
function renderHome(){
  var today = todayISO();
  document.getElementById('homeSub').textContent =
    (new Date().getMonth()+1) + '月' + new Date().getDate() + '日 ' + weekdayCN(today);

  refreshAdvice();   /* 建议区统一由 refreshAdvice 渲染：有旧 AI 建议先显示旧的 */

  var pending = tasks.filter(function(t){ return !t.done; })
                     .sort(function(a,b){ return a.date<b.date?-1:a.date>b.date?1:0; });
  var html = '';
  if(pending.length === 0){
    html = '<div class="group-title">全部未做<span class="n">0</span></div>'
         + '<div class="empty">没有未完成的任务</div>';
  } else {
    var groups = {}, order = [];
    pending.forEach(function(t){
      if(!groups[t.date]){ groups[t.date] = []; order.push(t.date); }
      groups[t.date].push(t);
    });
    html = '<div class="group-title">全部未做<span class="n">'+pending.length+'</span></div>';
    order.forEach(function(iso){
      var overdue = iso < today;
      html += '<div class="group-title'+(overdue?' overdue':'')+'">'
        + (overdue ? '逾期 · ' : '') + fmtDate(iso) + ' ' + weekdayCN(iso)
        + '<span class="n">'+groups[iso].length+'</span></div>';
      groups[iso].forEach(function(t){ html += taskHTML(t); });
    });
  }
  document.getElementById('homeList').innerHTML = html;
}
function renderCalendar(){
  var sel = state.sel, nowISO = todayISO();
  document.getElementById('calSub').textContent = fmtDate(sel) + ' ' + weekdayCN(sel);

  document.getElementById('monthLabel').textContent =
    (new Date(state.weekStart+'T00:00:00').getMonth()+1) + '月';
  var html = '';
  var names = ['一','二','三','四','五','六','日'];
  for(var i=0;i<7;i++){
    var iso = addDays(state.weekStart, i);
    var d = new Date(iso+'T00:00:00');
    var hasTask = tasks.some(function(t){ return t.date===iso && !t.done; });
    html += '<button class="day'
      + (iso===nowISO?' today':'') + (iso===sel?' sel':'')
      + '" onclick="pickDay(\''+iso+'\')">'
      + '<span class="dow">'+names[i]+'</span>'
      + '<span class="num">'+d.getDate()+'</span>'
      + '<span class="dot'+(hasTask?'':' none')+'"></span></button>';
  }
  document.getElementById('weekstrip').innerHTML = html;

  var pending = tasks.filter(function(t){ return t.date===sel && !t.done; });
  var done    = tasks.filter(function(t){ return t.date===sel && t.done; });
  var total = pending.length + done.length;
  document.getElementById('calSub').textContent += total ? ' · ' + done.length + '/' + total + ' 完成' : '';

  html = '';
  if(total === 0){
    html = '<div class="empty">这一天还没有任务，点击下方输入添加</div>';
  } else {
    html += '<div class="group-title">待办<span class="n">'+pending.length+'</span></div>';
    pending.forEach(function(t){ html += taskHTML(t); });
    if(done.length){
      html += '<div class="group-title">已完成<span class="n">'+done.length+'</span></div>';
      done.forEach(function(t){ html += taskHTML(t); });
    }
  }
  document.getElementById('calList').innerHTML = html;
}
function taskHTML(t){
  return '<div class="task'+(t.done?' done':'')+'" data-id="'+t.id+'" onclick="toggleAnim(event,\''+t.id+'\')'
    + '" oncontextmenu="event.preventDefault();openMenu(\''+t.id+'\')">'
    + '<button class="chk" aria-label="切换状态">'
    + '<svg viewBox="0 0 16 16"><polyline points="2.5,8.5 6.5,12.5 13.5,4"/></svg></button>'
    + '<div class="txt">'+esc(t.text)+'</div></div>';
}
function esc(s){
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
function fmtDate(iso){
  var t = todayISO();
  if(iso===t) return '今天';
  if(iso===addDays(t,1)) return '明天';
  var d = new Date(iso+'T00:00:00');
  return (d.getMonth()+1) + '月' + d.getDate() + '日';
}
function updatePlaceholder(){
  var el = document.getElementById('input');
  el.placeholder = state.tab==='home' ? '添加到今天…' : '添加到 ' + fmtDate(state.sel) + '…';
}

/* 输入条展开 / 收起（首页默认收起，日历页默认展开；仅点箭头才收起） */
function showComposer(autofocus){
  var c = document.getElementById('composer');
  updatePlaceholder();
  c.classList.add('show');
  document.getElementById('addbtn').classList.add('open');
  if(autofocus) setTimeout(function(){ document.getElementById('input').focus(); }, 240);
}
function toggleComposer(){
  var c = document.getElementById('composer');
  if(c.classList.contains('show')){ hideComposer(); return; }
  showComposer(true);
}
function hideComposer(){
  document.getElementById('composer').classList.remove('show');
  document.getElementById('addbtn').classList.remove('open');
  document.getElementById('input').blur();
}

/* ===== 路由 ===== */
function switchTab(tab){
  state.tab = tab;
  document.getElementById('tab-home').classList.toggle('active', tab==='home');
  document.getElementById('tab-calendar').classList.toggle('active', tab==='calendar');
  document.getElementById('tabbtn-home').classList.toggle('active', tab==='home');
  document.getElementById('tabbtn-calendar').classList.toggle('active', tab==='calendar');
  updatePlaceholder();
  /* 首页默认收起，日历页默认展开 */
  if(tab==='calendar') showComposer(false); else hideComposer();
}

/* ===== 交互 ===== */
function pickDay(iso){
  state.sel = iso;
  if(weekStartOf(iso)!==state.weekStart) state.weekStart = weekStartOf(iso);
  render();
}
function shiftWeek(n){
  state.weekStart = addDays(state.weekStart, n*7);
  var w = (new Date(state.sel+'T00:00:00').getDay()+6)%7;
  state.sel = addDays(state.weekStart, w);
  render();
}
/* 勾选/取消：先播动画再重排
   首页完成 = 勾选描边 → 右滑退场；日历完成 = 勾选描边 → 移入已完成组 */
function toggleAnim(e, id){
  var row = e.target.closest ? e.target.closest('.task') : null;
  var t = byId(id); if(!t || !row) return;
  if(!t.done){
    t.done = true; save();
    row.classList.add('done');                       /* 1. 先勾选 */
    if(state.tab==='home'){
      row.style.animation = 'slideOutRight .34s cubic-bezier(.4,0,.2,1) .3s forwards';  /* 2. 再右滑消失 */
      setTimeout(function(){ render(); }, 700);
    } else {
      setTimeout(function(){ render(); }, 480);      /* 移到已完成分组 */
    }
  } else {
    t.done = false; save();
    row.classList.remove('done');
    row.style.animation = 'taskIn .25s ease both';
    setTimeout(function(){ render(); }, 320);
  }
}
function addTask(){
  var el = document.getElementById('input');
  var text = el.value.trim();
  if(!text){ el.focus(); return; }
  var nid = 't'+Date.now()+Math.floor(Math.random()*1e4);
  var date = state.tab==='home' ? todayISO() : state.sel;
  tasks.push({ id: nid, date: date, text: text, done: false });
  el.value = ''; save(); render();
  var row = document.querySelector('.task[data-id="'+nid+'"]');
  if(row) row.classList.add('enter');   /* 新任务淡入 */
  toast('已添加到 ' + fmtDate(date));
  el.focus();   /* 保持展开，方便连续录入 */
}

/* 长按菜单 */
function openMenu(id){
  state.menuId = id;
  document.getElementById('mask').classList.add('show');
  document.getElementById('sheet').classList.add('show');
}
function closeAllSheets(){
  document.getElementById('mask').classList.remove('show');
  document.getElementById('sheet').classList.remove('show');
  document.getElementById('editSheet').classList.remove('show');
  document.getElementById('aiSheet').classList.remove('show');
  state.menuId = null; state.editId = null;
}
function menuEdit(){
  var id = state.menuId; closeAllSheets();
  openEdit(id);
}
function menuDelete(){
  var id = state.menuId; closeAllSheets();
  var i = tasks.findIndex(function(x){ return x.id===id; });
  if(i<0) return;
  var row = document.querySelector('.task[data-id="'+id+'"]');
  if(row) row.style.animation = 'slideOutLeft .28s ease forwards';   /* 左滑退场 */
  setTimeout(function(){
    tasks.splice(i,1); save(); render(); toast('已删除');
  }, 300);
}

/* 编辑弹窗 */
function openEdit(id){
  var t = byId(id); if(!t) return;
  state.editId = id;
  document.getElementById('editText').value = t.text;
  document.getElementById('editDate').value = t.date;
  document.getElementById('mask').classList.add('show');
  document.getElementById('editSheet').classList.add('show');
  setTimeout(function(){ document.getElementById('editText').focus(); }, 320);
}
function saveEdit(){
  var t = byId(state.editId);
  var text = document.getElementById('editText').value.trim();
  var date = document.getElementById('editDate').value;
  if(t && text && date){
    t.text = text; t.date = date; save(); render();
    toast('已保存到 ' + fmtDate(date));
  }
  closeAllSheets();
}

var toastTimer = 0;
function toast(msg){
  var el = document.getElementById('toast');
  el.textContent = msg; el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){ el.classList.remove('show'); }, 1600);
}

/* 长按触发（移动端 touch / 桌面右键等效） */
document.addEventListener('touchstart', function(e){
  var row = e.target.closest ? e.target.closest('.task') : null;
  if(!row) return;
  var id = row.getAttribute('data-id');
  pressTimer = setTimeout(function(){ openMenu(id); }, 500);
}, {passive:true});
['touchend','touchmove','touchcancel'].forEach(function(ev){
  document.addEventListener(ev, function(){ clearTimeout(pressTimer); }, {passive:true});
});
var pressTimer = 0;

/* ===== 版本缓存检查：线上有新版自动刷新 ===== */
function checkUpdate(){
  if(location.protocol !== 'http:' && location.protocol !== 'https:') return;  /* 本地 file 预览跳过 */
  fetch(location.href.split('#')[0] + (location.search ? '&' : '?') + '_v=' + Date.now(), {cache:'no-store'})
    .then(function(r){ return r.text(); })
    .then(function(html){
      var m = html.match(/APP_VER\s*=\s*(\d+)/);
      if(m && +m[1] !== APP_VER){
        toast('发现新版本，正在更新…');
        setTimeout(function(){ location.replace(location.pathname + '?v=' + Date.now()); }, 1200);
      }
    }).catch(function(){});
}
checkUpdate();
document.addEventListener('visibilitychange', function(){
  if(!document.hidden) checkUpdate();   /* 切回 App 时也检查一次 */
});

/* ===== 初始化 ===== */
/* 实时跟踪可视视口高度：Safari 底栏收起/展开、键盘弹出都即时贴合 */
function fitViewport(){
  var h = window.visualViewport ? Math.round(visualViewport.height) : window.innerHeight;
  document.documentElement.style.setProperty('--vvh', h + 'px');
}
if(window.visualViewport) visualViewport.addEventListener('resize', fitViewport);
window.addEventListener('resize', fitViewport);
window.addEventListener('orientationchange', function(){ setTimeout(fitViewport, 100); });
fitViewport();

/* ===== iOS standalone 键盘视口 Bug 自愈 =====
   键盘弹出会压缩 WebKit 视口画布，收起后画布卡在小尺寸回不去，
   底部留下白条（键盘背景）。社区验证解法：键盘收起后把全屏容器
   display 隐藏→强制回流→恢复，逼 WebKit 重新测量画布。 */
var maxVH = window.innerHeight;
window.addEventListener('resize', function(){ maxVH = Math.max(maxVH, window.innerHeight); });
function healViewport(){
  if(maxVH - window.innerHeight > 80){   /* 视口被键盘 Bug 卡在小尺寸 */
    var el = document.querySelector('.phone');
    el.style.display = 'none';
    void el.offsetHeight;                /* 强制 reflow，触发画布重测 */
    el.style.display = '';
    setTimeout(function(){
      if(maxVH - window.innerHeight > 80) setTimeout(healViewport, 140);
    }, 100);
  }
  fitViewport();
}
/* 输入框失焦（键盘收起）后触发自愈 */
document.addEventListener('focusout', function(e){
  var t = e.target;
  if(t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA')){
    setTimeout(healViewport, 250);
    setTimeout(function(){ window.scrollTo(0, 0); }, 350);   /* 顺带强制重绘 */
  }
}, true);
/* 切回 App 时也检查一次 */
document.addEventListener('visibilitychange', function(){
  if(!document.hidden) setTimeout(healViewport, 300);
});
/* 防双击误触「隐形键盘」导致的白板（iOS 已知 Bug 的通用规避） */
document.querySelector('.phone').addEventListener('touchstart', function(){}, {passive:true});

document.getElementById('verTag').textContent = 'v0.' + APP_VER;   /* 标题旁显示版本号 */
/* Service Worker：每次启动强制联网拿最新页面（iOS 主屏幕 App 防缓存） */
if('serviceWorker' in navigator && location.protocol === 'https:'){
  navigator.serviceWorker.register('sw.js').catch(function(){});
}
load();
render();
</script>
